name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # ADR-0003: MVP の対象環境は macOS arm64。Linux x86_64 は M2（T0）で追加した。
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Show C compiler
        run: clang --version
      # M4 PoC3: CPython の埋め込み。Python 3.14（GIL あり）に固定し、見つからなければ失敗させる
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.14"
      - uses: Swatinem/rust-cache@v2
      - name: Run CI checks
        run: ./scripts/ci.sh
        env:
          WYS_PYTHON: ${{ steps.python.outputs.python-path }}
          WYS_REQUIRE_PYTHON: "1"
