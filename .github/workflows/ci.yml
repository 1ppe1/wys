name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # ADR-0003: MVP の対象環境は macOS arm64。Linux x86_64 は M2 で追加する。
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Run CI checks
        run: ./scripts/ci.sh
