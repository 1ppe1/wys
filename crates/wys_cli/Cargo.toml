[package]
name = "wys_cli"
description = "コマンドラインインターフェース（build/run/check）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
wys_driver = { path = "../wys_driver" }
wys_backend = { path = "../wys_backend" }
wys_fmt = { path = "../wys_fmt" }
wys_explain = { path = "../wys_explain" }
# `wys lsp`（M6 PoC6）。生成した実行ファイルとランタイムは依存しない（AC-004）
wys_lsp = { path = "../wys_lsp" }
# `wys llm-proxy`（PoC4、M5 T1）: 実プロバイダへの HTTPS。生成した実行ファイルは依存しない（AC-004）
ureq = "2"
serde_json = "1"

[dev-dependencies]
serde_json = "1"

[[bin]]
name = "wys"
path = "src/main.rs"
