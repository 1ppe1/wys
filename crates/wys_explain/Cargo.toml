[package]
name = "wys_explain"
description = "`wys explain`: プログラムの説明レポートとエラーコードの説明（DX-004、ADR-0017）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
wys_driver = { path = "../wys_driver" }
